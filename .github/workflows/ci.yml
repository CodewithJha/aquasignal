name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      AI_PROVIDER: "null"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Smoke — fresh DB, seed, serve, /healthz
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite3
        run: |
          python scripts/seed_aquasignal_demo.py
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          curl -fsS -o /dev/null http://127.0.0.1:8000/investigate/sites/coimbra

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t confirmgate:ci .
      - name: Run and probe /healthz
        run: |
          docker run -d --name cg -p 8000:8000 confirmgate:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8000/investigate
